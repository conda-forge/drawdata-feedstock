schema_version: 1

context:
  name: drawdata
  version: "0.5.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/koaning/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1f2f22dc3f927e8db6e4602447d01fa580a988c8daeae88cf7a0537f89d9343c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - anywidget >=0.9.2

tests:
  - python:
      imports:
        - drawdata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Draw a dataset in a jupyter notebook.
  license: MIT
  license_file: LICENSE
  homepage: https://calmcode.io/labs/drawdata.html
  repository: https://github.com/koaning/drawdata

extra:
  recipe-maintainers:
    - thewchan
